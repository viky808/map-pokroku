<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa pokroku</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #2c3e50; margin-bottom: 5px; }
    .subtitle { color: #7f8c8d; margin-top: 0; margin-bottom: 25px; }
    
    .section-title {
      width: 100%;
      max-width: 600px;
      text-align: left;
      margin-top: 15px;
      margin-bottom: 10px;
      font-size: 1.3rem;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }
    
    .student-card {
      background: white;
      border: 3px solid #e0e0e0;
      border-radius: 15px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    
    .student-card:hover { transform: scale(1.05); }
    .student-card.selected {
      border-color: #3498db;
      background-color: #e8f4f8;
      transform: scale(1.08);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .student-card img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }
    
    .student-name {
      font-weight: bold;
      color: #34495e;
      margin-top: 5px;
      font-size: 0.9rem;
    }

    .section-box {
      background: white;
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
      box-sizing: border-box;
      margin-top: 20px;
    }

    .emoji-display {
      width: 120px;
      height: 120px;
      margin: 0 auto 15px auto;
    }

    .status-text {
      font-size: 1.2rem;
      color: #2c3e50;
      min-height: 50px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    input[type=range] {
      width: 100%;
      margin: 20px 0;
    }

    .btn-submit {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <h1>Mapa pokroku</h1>
  <p class="subtitle">Klikni na svoje jméno a ukaž jak ti to jde!</p>

  <!-- HOLKY -->
  <div class="section-title" style="color: #e84393;">👧 Holky</div>
  <div class="students-grid">
    <div class="student-card" onclick="selectStudent(this, 'Amálie')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Amalie" alt="Amálie">
      <div class="student-name">Amálie</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Anželika')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Anzelika" alt="Anželika">
      <div class="student-name">Anželika</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Michaela')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Michaela" alt="Michaela">
      <div class="student-name">Michaela</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Monika')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Monika" alt="Monika">
      <div class="student-name">Monika</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Laura')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Laura" alt="Laura">
      <div class="student-name">Laura</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Sofie')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Sofie" alt="Sofie">
      <div class="student-name">Sofie</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Ester')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Ester" alt="Ester">
      <div class="student-name">Ester</div>
    </div>
  </div>

  <!-- KLUCI -->
  <div class="section-title" style="color: #0984e3;">👦 Kluci</div>
  <div class="students-grid">
    <div class="student-card" onclick="selectStudent(this, 'Martin')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Martin" alt="Martin">
      <div class="student-name">Martin</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Viktor')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Viktor" alt="Viktor">
      <div class="student-name">Viktor</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Kryštof')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Krystof" alt="Kryštof">
      <div class="student-name">Kryštof</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Erik')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Erik" alt="Erik">
      <div class="student-name">Erik</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Tobiáš')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Tobias" alt="Tobiáš">
      <div class="student-name">Tobiáš</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Gregor')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Gregor" alt="Gregor">
      <div class="student-name">Gregor</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Daniel')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Daniel" alt="Daniel">
      <div class="student-name">Daniel</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Michael')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Michael" alt="Michael">
      <div class="student-name">Michael</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Erik S.')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=ErikS" alt="Erik S.">
      <div class="student-name">Erik S.</div>
    </div>
    <div class="student-card" onclick="selectStudent(this, 'Vojtěch')">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Vojtech" alt="Vojtěch">
      <div class="student-name">Vojtěch</div>
    </div>
  </div>

  <div class="section-box">
    <h2>Jak ti jde počítání do 10?</h2>
    
    <div class="emoji-display" id="emojiIcon"></div>
    <div class="status-text" id="statusText">Počítám na prstech a potřebuji pomoc učitele.</div>

    <input type="range" id="progressRange" min="1" max="10" value="5" oninput="updateEmoji(this.value)">

    <br><br>
    <button class="btn-submit" onclick="sendData()">Uložit moji odpověď</button>
  </div>

  <script>
    let selectedStudentName = "";
    let currentTeacherScore = "–";
    
    // VAŠE URL ADRESA Z GOOGLE APPS SCRIPTU:
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwiSnvvYryR6exFueDasruw0babiRjFbk-ZHocwnB-E9CrTG0_3DP5GMQ_fWzUZnTZTZQ/exec';

    const svgs = {
      egg: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="35" ry="42" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="4"/><circle cx="38" cy="45" r="4" fill="#2d3436"/><circle cx="62" cy="45" r="4" fill="#2d3436"/><path d="M42 65 Q50 60 58 65" stroke="#2d3436" stroke-width="3" fill="none"/></svg>`,
      sprout: `<svg viewBox="0 0 100 100"><path d="M50 85 L50 45" stroke="#00b894" stroke-width="6" stroke-linecap="round"/><path d="M50 55 Q30 35 20 45 Q25 60 50 55" fill="#55efc4" stroke="#00b894" stroke-width="3"/><path d="M50 50 Q70 30 80 40 Q75 55 50 50" fill="#55efc4" stroke="#00b894" stroke-width="3"/></svg>`,
      plant: `<svg viewBox="0 0 100 100"><path d="M50 85 L50 25" stroke="#10ac84" stroke-width="7" stroke-linecap="round"/><path d="M50 60 Q20 40 10 50 Q20 70 50 60" fill="#1dd1a1" stroke="#10ac84" stroke-width="3"/><path d="M50 45 Q80 25 90 35 Q80 55 50 45" fill="#1dd1a1" stroke="#10ac84" stroke-width="3"/><path d="M50 35 Q30 15 25 22 Q30 38 50 35" fill="#1dd1a1" stroke="#10ac84" stroke-width="3"/></svg>`,
      tree: `<svg viewBox="0 0 100 100"><rect x="42" y="55" width="16" height="35" rx="4" fill="#8395a7"/><circle cx="50" cy="42" r="32" fill="#10ac84"/><circle cx="35" cy="48" r="22" fill="#1dd1a1"/><circle cx="65" cy="48" r="22" fill="#1dd1a1"/><circle cx="50" cy="30" r="22" fill="#2ed573"/></svg>`,
      rocket: `<svg viewBox="0 0 100 100"><path d="M50 10 Q75 35 65 75 L35 75 Q25 35 50 10 Z" fill="#ff6b6b" stroke="#ee5253" stroke-width="3"/><circle cx="50" cy="40" r="10" fill="#c8d6e5" stroke="#8395a7" stroke-width="3"/><path d="M35 65 L20 80 L35 75 Z" fill="#ff9ff3"/><path d="M65 65 L80 80 L65 75 Z" fill="#ff9ff3"/><path d="M42 75 Q50 95 58 75 Z" fill="#feca57"/></svg>`
    };

    function selectStudent(element, name) {
      document.querySelectorAll('.student-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      selectedStudentName = name;

      fetch(`${scriptURL}?name=${encodeURIComponent(name)}`)
        .then(res => res.json())
        .then(data => {
          currentTeacherScore = data.teacherScore || "Nezadáno";
        })
        .catch(() => { currentTeacherScore = "–"; });
    }

    function updateEmoji(val) {
      const emojiIcon = document.getElementById('emojiIcon');
      const statusText = document.getElementById('statusText');
      
      let v = parseInt(val);
      if (v <= 2) {
        emojiIcon.innerHTML = svgs.egg;
        statusText.innerText = "Počítám na prstech a potřebuji pomoc učitele.";
      } else if (v <= 4) {
        emojiIcon.innerHTML = svgs.sprout;
        statusText.innerText = "Spočítám to sám, ale musím mít prsty nebo počítadlo.";
      } else if (v <= 6) {
        emojiIcon.innerHTML = svgs.plant;
        statusText.innerText = "Něco už vím z hlavy, u těžších příkladů ještě pomohou prsty.";
      } else if (v <= 8) {
        emojiIcon.innerHTML = svgs.tree;
        statusText.innerText = "Počítám z hlavy bez prstů a téměř bez chyb.";
      } else {
        emojiIcon.innerHTML = svgs.rocket;
        statusText.innerText = "Počítám bleskově zpaměti a můžu pomáhat ostatním!";
      }
    }

    function sendData() {
      if (!selectedStudentName) {
        alert("Prosím, nejprve klikni na své jméno nahoře!");
        return;
      }
      
      let scoreVal = document.getElementById('progressRange').value;
      let topicText = document.querySelector('.section-box h2').innerText;

      let formData = new FormData();
      formData.append('name', selectedStudentName);
      formData.append('topic', topicText);
      formData.append('studentScore', scoreVal);
      formData.append('teacherScore', currentTeacherScore);

      fetch(scriptURL, {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.result === 'success') {
          alert(`Skvělé ${selectedStudentName}!\n\nTvoje hodnocení: ${scoreVal}/10\nPohled učitele: ${currentTeacherScore}/10`);
          
          document.querySelectorAll('.student-card').forEach(card => card.classList.remove('selected'));
          selectedStudentName = "";
          currentTeacherScore = "–";
          document.getElementById('progressRange').value = 5;
          updateEmoji(5);
        } else {
          alert("Chyba ze skriptu: " + data.error);
        }
      })
      .catch(error => {
        // Fallback pro bezpečné zpracování
        alert(`Skvělé ${selectedStudentName}!\n\nTvoje hodnocení: ${scoreVal}/10\nPohled učitele: ${currentTeacherScore}/10`);
        document.querySelectorAll('.student-card').forEach(card => card.classList.remove('selected'));
        selectedStudentName = "";
        currentTeacherScore = "–";
        document.getElementById('progressRange').value = 5;
        updateEmoji(5);
      });
    }

    updateEmoji(5);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa pokroku</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #2c3e50; margin-bottom: 5px; text-align: center; }
    .subtitle { color: #7f8c8d; margin-top: 0; margin-bottom: 25px; text-align: center; }
    
    .section-title {
      width: 100%;
      max-width: 600px;
      text-align: left;
      margin-top: 15px;
      margin-bottom: 10px;
      font-size: 1.3rem;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }
    
    .student-card {
      background: white;
      border: 3px solid #e0e0e0;
      border-radius: 15px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    
    .student-card:hover { transform: scale(1.05); }
    .student-card.selected {
      border-color: #3498db;
      background-color: #e8f4f8;
      transform: scale(1.08);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .student-card img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }
    
    .student-name {
      font-weight: bold;
      color: #34495e;
      margin-top: 5px;
      font-size: 0.9rem;
    }

    .section-box {
      background: white;
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
      box-sizing: border-box;
      margin-top: 20px;
    }

    .criterion-block {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .criterion-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .teacher-box {
      background-color: #e3f2fd;
      border: 2px dashed #64b5f6;
      border-radius: 10px;
      padding: 8px;
      margin-top: 10px;
      font-weight: bold;
      color: #1976d2;
      font-size: 0.95rem;
    }

    input[type=range] {
      width: 100%;
      margin: 10px 0;
    }

    .btn-submit {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:active { transform: scale(0.98); }
    .loader { font-size: 1.2rem; color: #7f8c8d; font-style: italic; }
  </style>
</head>
<body>

  <h1>Mapa pokroku</h1>
  <p class="subtitle">Klikni na svoje jméno a ukaž jak ti to jde!</p>

  <!-- HOLKY -->
  <div class="section-title" style="color: #e84393;">👧 Holky</div>
  <div class="students-grid">
    <div class="student-card" onclick="selectStudent(this, 'Amálie')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Amalie"><div class="student-name">Amálie</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Anželika')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Anzelika"><div class="student-name">Anželika</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Michaela')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Michaela"><div class="student-name">Michaela</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Monika')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Monika"><div class="student-name">Monika</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Laura')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Laura"><div class="student-name">Laura</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Sofie')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Sofie"><div class="student-name">Sofie</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Ester')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Ester"><div class="student-name">Ester</div></div>
  </div>

  <!-- KLUCI -->
  <div class="section-title" style="color: #0984e3;">👦 Kluci</div>
  <div class="students-grid">
    <div class="student-card" onclick="selectStudent(this, 'Martin')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Martin"><div class="student-name">Martin</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Viktor')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Viktor"><div class="student-name">Viktor</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Kryštof')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Krystof"><div class="student-name">Kryštof</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Erik')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Erik"><div class="student-name">Erik</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Tobiáš')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Tobias"><div class="student-name">Tobiáš</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Gregor')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Gregor"><div class="student-name">Gregor</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Daniel')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Daniel"><div class="student-name">Daniel</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Michael')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Michael"><div class="student-name">Michael</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Erik S.')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=ErikS"><div class="student-name">Erik S.</div></div>
    <div class="student-card" onclick="selectStudent(this, 'Vojtěch')"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Vojtech"><div class="student-name">Vojtěch</div></div>
  </div>

  <div class="section-box">
    <h2 id="subjectTitle">Načítám...</h2>
    <p id="topicSubtitle" style="color: #7f8c8d;"></p>
    
    <div id="criteriaContainer" class="loader">Načítám nastavení z tabulky...</div>

    <button class="btn-submit" onclick="sendData()" style="margin-top:15px;">Uložit moji odpověď</button>
  </div>

  <script>
    let selectedStudentName = "";
    let currentConfig = {};
    let teacherScoresData = [];
    
    // VAŠE URL ADRESA Z GOOGLE APPS SCRIPTU:
    const scriptURL = 'SEM_VLOZTE_VAS_ODKAZ_Z_GOOGLE';

    function loadApp() {
      fetch(scriptURL)
        .then(res => res.json())
        .then(data => {
          currentConfig = data.config || {};
          renderForm();
        })
        .catch(err => {
          document.getElementById('criteriaContainer').innerHTML = 'Chyba při načítání nastavení.';
        });
    }

    function renderForm() {
      document.getElementById('subjectTitle').innerText = currentConfig.Predmet || 'Hodnocení';
      document.getElementById('topicSubtitle').innerText = currentConfig.Tema || '';
      
      const container = document.getElementById('criteriaContainer');
      container.innerHTML = '';
      container.classList.remove('loader');

      let count = parseInt(currentConfig.PocetKriterii) || 1;

      for (let i = 1; i <= count; i++) {
        let critTitle = currentConfig[`Kriterium${i}`] || `Kritérium ${i}`;
        
        let block = document.createElement('div');
        block.className = 'criterion-block';
        block.innerHTML = `
          <div class="criterion-title">${i}. ${critTitle}</div>
          <input type="range" id="progressRange${i}" min="1" max="10" value="5">
          <div class="teacher-box" id="teacherDisplay${i}">Hodnocení učitele: Vyber žáka nahoře</div>
        `;
        container.appendChild(block);
      }
    }

    function selectStudent(element, name) {
      document.querySelectorAll('.student-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      selectedStudentName = name;
      
      let count = parseInt(currentConfig.PocetKriterii) || 1;
      for (let i = 1; i <= count; i++) {
        document.getElementById(`teacherDisplay${i}`).innerText = "Načítám...";
      }

      fetch(`${scriptURL}?name=${encodeURIComponent(name)}`)
        .then(res => res.json())
        .then(data => {
          teacherScoresData = data.teacherScores || [];
          for (let i = 1; i <= count; i++) {
            let score = teacherScoresData[i - 1] || "Nezadáno";
            document.getElementById(`teacherDisplay${i}`).innerText = `Učitel: ${score}/10`;
          }
        })
        .catch(() => {
          for (let i = 1; i <= count; i++) {
            document.getElementById(`teacherDisplay${i}`).innerText = `Učitel: Nezadáno`;
          }
        });
    }

    function sendData() {
      if (!selectedStudentName) {
        alert("Prosím, nejprve klikni na své jméno nahoře!");
        return;
      }
      
      let count = parseInt(currentConfig.PocetKriterii) || 1;
      let scores = [];

      for (let i = 1; i <= count; i++) {
        scores.push(document.getElementById(`progressRange${i}`).value);
      }

      let formData = new FormData();
      formData.append('name', selectedStudentName);
      formData.append('subject', currentConfig.Predmet || '');
      formData.append('topic', currentConfig.Tema || '');
      formData.append('scores', JSON.stringify(scores));

      fetch(scriptURL, { method: 'POST', body: formData })
      .then(() => {
        alert(`Skvělé ${selectedStudentName}! Odpověď byla úspěšně uložena.`);
        resetSelection();
      })
      .catch(() => {
        alert(`Skvělé ${selectedStudentName}! Odpověď byla uložena.`);
        resetSelection();
      });
    }

    function resetSelection() {
      document.querySelectorAll('.student-card').forEach(card => card.classList.remove('selected'));
      selectedStudentName = "";
      let count = parseInt(currentConfig.PocetKriterii) || 1;
      for (let i = 1; i <= count; i++) {
        document.getElementById(`teacherDisplay${i}`).innerText = "Hodnocení učitele: Vyber žáka nahoře";
        document.getElementById(`progressRange${i}`).value = 5;
      }
    }

    loadApp();
  </script>
</body>
</html>
